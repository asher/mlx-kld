name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the newest in-range mlx / mlx-lm releases. This tool
    # reads mlx-lm internals (model loading, tokenizer wrapping), so an upstream
    # release can break it without a push to this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # MLX is Apple-Silicon only, so the suite needs an arm64 macOS runner.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject advertises. 3.10 is the requires-python
        # floor and 3.13 the newest qualified release. The [gguf] extra needs
        # 3.11+ and is not installed here, so its tests skip themselves when
        # gmlx is absent.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import canary
        # A broken package import must fail the build loudly. The test files
        # importorskip only true optionals, never mlx_kld itself.
        run: python -c "import mlx_kld, mlx_kld.cli, mlx_kld.cache, mlx_kld.kld_math, mlx_kld.measure, mlx_kld.plot, mlx_kld.report, mlx_kld.scoring"
      - name: Unit suite
        # No model load, no network: everything runs against fakes and tmp dirs.
        run: pytest -q
      - name: CLI self-test
        # The numerical + schema suite the CLI ships, run the way a user runs it.
        run: mlx-kld self-test
      - name: Wheel completeness
        # An editable install cannot catch packaging drops: build the wheel (via
        # sdist, so a stale build/ dir cannot leak deleted modules into it) and
        # require it to ship exactly the tracked package modules, plus py.typed.
        run: |
          python -m pip install --upgrade build
          python -m build
          python - <<'EOF'
          import glob, subprocess, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          shipped = set(zipfile.ZipFile(wheel).namelist())
          tracked = subprocess.run(
              ["git", "ls-files", "src/mlx_kld/**/*.py", "src/mlx_kld/*.py"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          # Wheel paths are package-relative; tracked paths carry the src/ prefix.
          want = {t[len("src/"):] for t in tracked}
          missing = sorted(want - shipped)
          if missing:
              sys.exit(f"wheel is missing tracked modules: {missing}")
          extra = sorted(
              m for m in shipped
              if m.startswith("mlx_kld/") and m.endswith(".py") and m not in want
          )
          if extra:
              sys.exit(f"wheel ships untracked modules (stale build/?): {extra}")
          if "mlx_kld/py.typed" not in shipped:
              sys.exit("wheel is missing py.typed; the package advertises inline types")
          print(f"wheel ships all {len(want)} tracked modules + py.typed, nothing else")
          EOF

  lint:
    # Lint needs no MLX, so it runs on the cheapest runner available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned: a new ruff's new default rules should not fail an untouched repo.
      - run: pip install ruff==0.15.20
      - run: ruff check src tests conftest.py
